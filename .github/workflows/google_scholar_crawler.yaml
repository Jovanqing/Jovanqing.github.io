name: Get Citation Data

on:
  workflow_dispatch:
  page_build:
  schedule:
    - cron: '0 0,6,12,18 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd ./google_scholar_crawler
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Google Scholar data
        id: fetch
        timeout-minutes: 4
        continue-on-error: true
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: |
          cd ./google_scholar_crawler
          python main.py

      - name: Push results to google-scholar-stats branch
        if: steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ./google_scholar_crawler/results
          git init -b google-scholar-stats
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.json
          git commit -m "Update citation data ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push --force "https://${GITHUB_ACTOR}:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:google-scholar-stats

      - name: Report Scholar fetch failure (non-fatal)
        if: steps.fetch.outcome != 'success'
        run: |
          echo "::warning::Google Scholar fetch failed or timed out -- likely scholarly was rate-limited / captcha-blocked by Scholar. The next scheduled run (every 6h) will retry."
          exit 0
