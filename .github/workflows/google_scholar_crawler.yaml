name: Get Citation Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 */3 * *"  # every 3 days, ~10 SerpApi calls/month (free tier: 250)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch citation count via SerpApi
        env:
          SERPAPI_API_KEY: ${{ secrets.GOOGLE_SCHOLAR_ID_NEW }}  # holds the SerpApi key
          GOOGLE_SCHOLAR_ID: WmV_Z7UAAAAJ
        run: |
          cd ./google_scholar_crawler
          python3 main.py

      - name: Push badge data to google-scholar-stats branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ./google_scholar_crawler/results
          git init -b google-scholar-stats
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gs_data_shieldsio.json
          git commit -m "Update citation data ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push --force "https://${GITHUB_ACTOR}:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:google-scholar-stats
          # the badge reads the file through jsDelivr; drop its cached copy
          curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@google-scholar-stats/gs_data_shieldsio.json" || true
