<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ClustrMaps</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      text-align: center;
    }
    /* The widget injects an <a> wrapping an <img>; constrain to the iframe size. */
    body > a,
    body > img,
    body img {
      max-width: 100% !important;
      height: auto !important;
      display: inline-block !important;
      border: 0 !important;
    }
    /* Hide the date-range header text the widget prints first */
    body { font-size: 11px; color: #999; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <script type="text/javascript" id="clstr_globe"
    src="//clustrmaps.com/globe.js?d=TEkAEEg2ggub9J3Rlv-xpwasnPS00fxPIGPl3Dutw1Q"></script>

  <script>
    /* ClustrMaps wraps the globe canvas in an <a> that navigates the
       iframe to https://clustrmaps.com/site/... — that target page
       refuses iframe embedding (X-Frame-Options), giving the user a
       "connection refused" page. Neutralize the navigation so the
       click is a no-op and the globe stays decorative. */
    function disarmClustrLinks() {
      document.querySelectorAll('a').forEach(function (a) {
        a.removeAttribute('target');
        a.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
        }, true);
        a.style.cursor = 'default';
      });
    }
    /* The globe injects DOM after script load; retry a few times. */
    var attempts = 0;
    var iv = setInterval(function () {
      disarmClustrLinks();
      if (++attempts > 12) clearInterval(iv);
    }, 500);
    document.addEventListener('DOMContentLoaded', disarmClustrLinks);
  </script>
</body>
</html>
