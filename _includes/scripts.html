{% include analytics.html %}

<script>
  /* The sticky sidebar is taller than most laptop screens: let it scroll with the page
     until its bottom (ORCID link) is in view, then stick there. */
  (function () {
    var sb = document.querySelector('.sidebar.sticky');
    if (!sb) return;
    function fit() { sb.style.top = Math.min(96, window.innerHeight - sb.offsetHeight - 16) + 'px'; }
    window.addEventListener('resize', fit);
    window.addEventListener('load', fit);
    fit();
  })();

  /* Paper videos load nothing up front (poster + preload="none"): play only while near the viewport. */
  (function () {
    var vids = document.querySelectorAll('.paper-box video');
    var each = function (fn) { Array.prototype.forEach.call(vids, fn); };
    var play = function (v) { var p = v.play(); if (p && p.catch) p.catch(function () {}); };
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      each(function (v) { v.controls = true; });
      return;
    }
    if (!('IntersectionObserver' in window)) { each(play); return; }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { play(e.target); } else { e.target.pause(); }
      });
    }, { rootMargin: '200px 0px' });
    each(function (v) { io.observe(v); });
  })();

  /* Reveal on scroll: papers, timeline items and the spotlight fade in once as they come into view.
     Classes are added here only, so no-JS / reduced-motion / no-IntersectionObserver visitors see
     everything, and whatever is already on screen at load is shown at once. */
  (function () {
    if (!('IntersectionObserver' in window)) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('is-visible'); io.unobserve(e.target); }
      });
    });
    var vh = window.innerHeight;
    Array.prototype.forEach.call(document.querySelectorAll('.paper-box, .timeline-list > li, .vibe-spotlight'), function (el) {
      var box = el.closest('.news-scroll'); /* News items are also clipped by their own scroll box */
      var bottom = box ? Math.min(vh, box.getBoundingClientRect().bottom) : vh;
      if (el.getBoundingClientRect().top < bottom) { el.classList.add('is-visible'); return; }
      el.classList.add('reveal');
      io.observe(el);
    });
  })();
</script>
